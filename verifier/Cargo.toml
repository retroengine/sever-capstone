# sever-verify (C-16): the offline certificate verifier (spec §11.3, §16.3; Build 3-4 §1.4).
# Its own workspace: it shares no code with the engine in crates/ (Build 3-4 §1.6). It implements
# the certificate parser, generator derivation and self-check, proof check, Merkle check and
# signature checks itself, on the pinned primitive crates of spec §20.1 only.
[package]
name = "sever-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Offline verifier of SEVER-DB deletion certificates (spec §11.3)"

[workspace]

[lib]
name = "sever_verify"
path = "src/lib.rs"

[[bin]]
name = "sever-verify"
path = "src/main.rs"

[dependencies]
curve25519-dalek = "=4.1.3" # spec §20.1
sha2 = "=0.10.9" # spec §20.1
ed25519-dalek = "=2.2.0" # spec §20.1 (verify_strict, §9.8)
serde_json = "1" # the anchors file and the bundled golden files

[dev-dependencies]
# Test labels only (#[spec("SR-…")], Build §2.2): a no-op attribute, no verification code (DB-85).
sever-spec = { path = "../crates/sever-spec" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
