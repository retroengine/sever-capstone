[package]
name = "sever-fuzz"
version = "0.0.0"
description = "L11 fuzz targets for Part 1's parsers (Build §4.7, gate P1-T12)"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sever-partition = { path = "../crates/sever-partition" }
sever-index = { path = "../crates/sever-index" }
sever-quant = { path = "../crates/sever-quant" }
sever-types = { path = "../crates/sever-types" }
sha2 = "=0.10.9"

# Not a member of the engine workspace: it needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "artefact_parse"
path = "fuzz_targets/artefact_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_parse"
path = "fuzz_targets/blob_parse.rs"
test = false
doc = false
bench = false
