# Licence and advisory policy (spec §19.2, Build §1.2), checked with `cargo deny check`.
# cargo-deny is not installed yet: `cargo install cargo-deny --locked`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
# Our own crates are unpublished (publish = false) and carry no licence field.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
