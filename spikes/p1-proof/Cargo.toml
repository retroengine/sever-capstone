# THROWAWAY proof spike (Build §3.4): deleted after its gate; its only output is the ledger entry.
[package]
name = "sever-spike-p1-proof"
version = "0.0.0"
description = "Proof spike before Part 1 freezes: EP-1 can carry Pedersen commitments, EP-3 can drive key rotation"
edition = "2024"
publish = false

[dependencies]
sever-index = { path = "../../crates/sever-index", features = ["contract-tests", "test-hooks"] }
sever-partition = { path = "../../crates/sever-partition" }
sever-quant = { path = "../../crates/sever-quant" }
sever-types = { path = "../../crates/sever-types" }
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "digest"] } # spec §20.1
rand_core = { version = "=0.6.4", features = ["getrandom"] } # spec §20.1
sha2 = "=0.10.9"
serde_json = "1"

# Outside the engine workspace: the spike never becomes part of a frozen part.
[workspace]
