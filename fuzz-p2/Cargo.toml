[package]
name = "sever-fuzz-p2"
version = "0.0.0"
description = "L11 fuzz targets for Part 2's parsers (Build §5.7, gate P2-T6); Part 1's fuzz/ is frozen"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sever-format = { path = "../crates/sever-format" }
sever-types = { path = "../crates/sever-types" }

# Not a member of the engine workspace: it needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "wal_record"
path = "fuzz_targets/wal_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_file"
path = "fuzz_targets/checkpoint_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_record"
path = "fuzz_targets/store_record.rs"
test = false
doc = false
bench = false
