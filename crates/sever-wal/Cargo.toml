[package]
name = "sever-wal"
version = "0.1.0"
description = "Write-ahead log: segments, transactions, torn-tail handling, replay (Part 2, spec §12.3)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §2.6: each builds the WAL with exactly one deliberate bug. A test must go red.
sabotage-SB-13 = [] # replay an uncommitted transaction

[dependencies]
sever-types = { path = "../sever-types" }
sever-vfs = { path = "../sever-vfs" }
sever-format = { path = "../sever-format" }

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
proptest = { version = "~1.6", default-features = false, features = ["std", "bit-set"] } # rand 0.8, no fork: one rand_core and one getrandom (spec §20.3 check 1)

[lints]
workspace = true
