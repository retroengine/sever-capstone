[package]
name = "sever-types"
version = "0.1.0"
description = "Record, group and collection IDs, constants, core errors and secret buffers (Part 1)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §3.4: the EP-4 contract suite, run by every SecretMemory provider, including later parts'.
contract-tests = []

[dependencies]
thiserror = "2"
zeroize = "=1.9.0" # spec §20.1

[dev-dependencies]
proptest = { version = "~1.6", default-features = false, features = ["std", "bit-set"] } # rand 0.8, no fork: one rand_core and one getrandom (spec §20.3 check 1)

[lints]
workspace = true
