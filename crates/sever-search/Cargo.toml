[package]
name = "sever-search"
version = "0.1.0"
description = "IVF-flat search with the pinned 8-lane kernel, scalar and AVX2 (Part 1, spec §8)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §2.6: each builds search with exactly one deliberate bug. A test must go red.
sabotage-SB-6 = [] # skip empty groups when filling the probe budget
sabotage-SB-9 = [] # enable FMA contraction in the SIMD kernel

[dependencies]
sever-types = { path = "../sever-types" }
sever-quant = { path = "../sever-quant" }
sever-index = { path = "../sever-index" }

[dev-dependencies]
sever-partition = { path = "../sever-partition" }
proptest = { version = "~1.6", default-features = false, features = ["std", "bit-set"] } # rand 0.8, no fork: one rand_core and one getrandom (spec §20.3 check 1)
serde_json = "1"

# Build §1.2: the workspace lints, except that `unsafe_code` is `deny` rather than `forbid`, because
# the AVX2 kernel is one of the listed exceptions. Exactly one module allows it, with SAFETY notes.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
