[package]
name = "sever-vfs"
version = "0.1.0"
description = "EP-5 Vfs: every file operation, PosixVfs and the crash-simulating SimVfs (Part 2, spec §12.2)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §3.4: the EP-5 contract suite, for every Vfs implementation, including later parts'.
contract-tests = []
# Build §2.6: each builds the durability helpers with exactly one deliberate bug.
sabotage-SB-12 = [] # skip the directory fsync after a rename
sabotage-SB-14 = [] # retry a failed fsync

[dependencies]

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
sever-vfs = { path = ".", features = ["contract-tests"] }
proptest = { version = "~1.6", default-features = false, features = ["std", "bit-set"] } # rand 0.8, no fork: one rand_core and one getrandom (spec §20.3 check 1)

[lints]
workspace = true
