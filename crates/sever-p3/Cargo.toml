[package]
name = "sever-p3"
version = "0.1.0"
description = "Part 3 composition root: Engine<CommitmentExtension, PlaintextSealer, (LogParticipant)>, operator keys, simulated witnesses, and the sever-db-p3 CLI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §2.6: each builds the crate with exactly one deliberate bug. A test must go red.
sabotage-SB-21 = [] # issue a certificate for a rolled-back deletion

[[bin]]
name = "sever-db-p3"
path = "src/bin/sever-db-p3.rs"

[dependencies]
sever-types = { path = "../sever-types" }
sever-index = { path = "../sever-index" }
sever-partition = { path = "../sever-partition" }
sever-vfs = { path = "../sever-vfs" }
sever-format = { path = "../sever-format" }
sever-txn = { path = "../sever-txn" }
sever-engine = { path = "../sever-engine" }
sever-p2 = { path = "../sever-p2" }
sever-crypto = { path = "../sever-crypto" }
sever-commit = { path = "../sever-commit" }
sever-log = { path = "../sever-log" }
sever-cert = { path = "../sever-cert" }
sever-quant = { path = "../sever-quant" }
rand_core = { version = "=0.6.4", features = ["getrandom"] } # spec §20.1: the OsRng source
zeroize = "=1.9.0" # spec §20.1
sha2 = "=0.10.9" # spec §20.1
serde_json = "1"

[dev-dependencies]
sever-spec = { path = "../sever-spec" }

[lints]
workspace = true
