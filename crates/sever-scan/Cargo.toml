[package]
name = "sever-scan"
version = "0.1.0"
description = "The forensic scanner (Part 4, overview EX-2, spec §16.3): known-plaintext search of a raw image, carving of engine records and key slots, and every carved key tried on every carved ciphertext"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sever-scan"
path = "src/bin/sever-scan.rs"

[[bin]]
name = "sever-demo-p4"
path = "src/bin/sever-demo-p4.rs"
required-features = ["demo"]

[[bin]]
name = "sever-ex2"
path = "src/bin/sever-ex2.rs"
required-features = ["forensics"]

[features]
# Build 3-4 §2.11: the erase demo (simulated disks laid out as an image); never a measured build.
demo = ["dep:sever-db", "dep:sever-engine", "dep:sever-vfs", "dep:sever-crypto", "dep:sever-quant", "dep:sever-index", "dep:sever-cert", "dep:rand_core"]
# The demo's leak, made visible: group-key rotation skipped (SB-24).
demo-sb24 = ["demo", "sever-seal/sabotage-SB-24"]
# Overview EX-2's engine side: the database on a mounted image, every generated key exported
# outside it (DB-54 `key-export`); never the measured build.
forensics = ["demo", "dep:sever-platform", "sever-keys/key-export"]

[dependencies]
sever-types = { path = "../sever-types" }
sever-format = { path = "../sever-format" }
sever-keys = { path = "../sever-keys" }
sever-seal = { path = "../sever-seal" }
sever-erasure = { path = "../sever-erasure" }
sever-txn = { path = "../sever-txn" }
sever-commit = { path = "../sever-commit" }
serde_json = "1"
sever-db = { path = "../sever-db", optional = true }
sever-engine = { path = "../sever-engine", optional = true }
sever-vfs = { path = "../sever-vfs", optional = true }
sever-crypto = { path = "../sever-crypto", optional = true }
sever-quant = { path = "../sever-quant", optional = true }
sever-index = { path = "../sever-index", optional = true }
sever-cert = { path = "../sever-cert", optional = true }
sever-platform = { path = "../sever-platform", optional = true }
rand_core = { version = "=0.6.4", features = ["getrandom"], optional = true }

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
sever-db = { path = "../sever-db" }
sever-engine = { path = "../sever-engine", features = ["test-hooks"] }
sever-vfs = { path = "../sever-vfs" }
sever-crypto = { path = "../sever-crypto" }
sever-quant = { path = "../sever-quant" }
sever-index = { path = "../sever-index" }
sever-txn = { path = "../sever-txn" }
sever-keys = { path = "../sever-keys", features = ["key-export"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[lints]
workspace = true
