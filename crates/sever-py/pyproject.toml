# Built with `maturin develop --release -m crates/sever-py/Cargo.toml` into the project .venv;
# the SDK package itself is python/sever_db (spec §16.2).
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "sever-db-native"
version = "0.1.0"
requires-python = "==3.13.*"

[tool.maturin]
module-name = "sever_db_native"
