[package]
name = "sever-db"
version = "0.1.0"
description = "The final composition root (Part 4): Engine<CommitmentExtension, AeadSealer, (LogParticipant, KeyRotationParticipant)>, the startup checks, and the sever-db CLI (spec §16)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sever-db"
path = "src/bin/sever-db.rs"

[features]
# DB-54 `sever-db-noerase` (EX-7): encryption kept, no key rotation, no key erase.
noerase = ["sever-erasure/noerase"]
# DB-107: a read-only participant that reports each committed change's public fields (Studio's
# build only; the default build compiles none of it). DB-110: and `Db::passage`, the engine's own
# read of a stored passage, which lives behind sever-engine's test hooks.
inspect = ["sever-engine/test-hooks"]

[dependencies]
sever-types = { path = "../sever-types" }
sever-index = { path = "../sever-index" }
sever-partition = { path = "../sever-partition" }
sever-vfs = { path = "../sever-vfs" }
sever-format = { path = "../sever-format" }
sever-txn = { path = "../sever-txn" }
sever-engine = { path = "../sever-engine" }
sever-p3 = { path = "../sever-p3" }
sever-crypto = { path = "../sever-crypto" }
sever-commit = { path = "../sever-commit" }
sever-log = { path = "../sever-log" }
sever-cert = { path = "../sever-cert" }
sever-seal = { path = "../sever-seal" }
sever-erasure = { path = "../sever-erasure" }
sever-platform = { path = "../sever-platform" }
sever-quant = { path = "../sever-quant" }
rand_core = { version = "=0.6.4", features = ["getrandom"] } # spec §20.1: the OsRng source
zeroize = "=1.9.0" # spec §20.1
sha2 = "=0.10.9" # spec §20.1
serde_json = "1"

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
sever-engine = { path = "../sever-engine", features = ["test-hooks"] }
sever-keys = { path = "../sever-keys", features = ["key-export"] }

[lints]
workspace = true
