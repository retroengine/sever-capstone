[package]
name = "sever-quant"
version = "0.1.0"
description = "Normalisation check, Q24 quantisation and dequantisation (Part 1, spec §4.1–4.3)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sever-types = { path = "../sever-types" }

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
proptest = { version = "~1.6", default-features = false, features = ["std", "bit-set"] } # rand 0.8, no fork: one rand_core and one getrandom (spec §20.3 check 1)
serde_json = "1"

[lints]
workspace = true
