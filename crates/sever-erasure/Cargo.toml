[package]
name = "sever-erasure"
version = "0.1.0"
description = "The key-rotation participant (EP-7 KeyRotationParticipant): rotation in the deletion transaction, phase A and phase C on the key file, the wrapped-key store, recovery by INV-14 (Part 4, spec §13.3, §13.4, §14.8, §15.3, §15.9, DB-90, DB-91)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
noerase = ["sever-seal/noerase"] # DB-54 sever-db-noerase (EX-7): no bucket rotation, no key erase
# Build §2.6: each builds the crate with exactly one deliberate bug. A test must go red.
sabotage-SB-25 = [] # skip bucket-key rotation
sabotage-SB-26 = [] # skip holding-area rotation on flush
sabotage-SB-27 = [] # erase the old key before commit

[dependencies]
sever-keys = { path = "../sever-keys" }
sever-seal = { path = "../sever-seal" }
sever-txn = { path = "../sever-txn" }
sever-index = { path = "../sever-index" }
sever-format = { path = "../sever-format" }
sever-appendstore = { path = "../sever-appendstore" }
sever-types = { path = "../sever-types" }
sever-vfs = { path = "../sever-vfs" }
sha2 = "=0.10.9" # spec §20.1 (the contract digest)

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
sever-txn = { path = "../sever-txn", features = ["contract-tests"] }
sever-engine = { path = "../sever-engine", features = ["test-hooks"] }
serde_json = "1"
sever-wal = { path = "../sever-wal" }
sever-checkpoint = { path = "../sever-checkpoint" }

[lints]
workspace = true
