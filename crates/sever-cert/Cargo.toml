[package]
name = "sever-cert"
version = "0.1.0"
description = "Deletion certificates: TLV encoding, strict parser, builder, operator signing by epoch; the log as an EP-7 transaction participant (Part 3, spec §10, §11.1-11.2, §15)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §2.6: each builds the crate with exactly one deliberate bug. A test must go red.
sabotage-SB-22 = [] # set group_emptied_by_this_deletion wrongly

[dependencies]
sever-crypto = { path = "../sever-crypto" }
sever-log = { path = "../sever-log" }
sever-commit = { path = "../sever-commit" }
sever-index = { path = "../sever-index" }
sever-txn = { path = "../sever-txn" }
sever-format = { path = "../sever-format" }
sever-types = { path = "../sever-types" }
sever-vfs = { path = "../sever-vfs" }

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
sever-engine = { path = "../sever-engine" }
sever-quant = { path = "../sever-quant" }
rand_core = { version = "=0.6.4", features = ["getrandom"] } # spec §20.1
serde_json = "1"

[lints]
workspace = true
