[package]
name = "sever-cert"
version = "0.1.0"
description = "Deletion certificates: TLV encoding, strict parser, builder, operator signing by epoch (Part 3, spec §11.1-11.2)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Build §2.6: each builds the crate with exactly one deliberate bug. A test must go red.
sabotage-SB-22 = [] # set group_emptied_by_this_deletion wrongly

[dependencies]
sever-crypto = { path = "../sever-crypto" }
sever-log = { path = "../sever-log" }

[dev-dependencies]
sever-spec = { path = "../sever-spec" }
serde_json = "1"

[lints]
workspace = true
