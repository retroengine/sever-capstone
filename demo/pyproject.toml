# SEVER-DB review demo (4 Oct 2026): the Part 1 core as a Python prototype plus a Part 3 preview.
# Self-contained: its own environment (uv.lock in this folder), tests, scripts and Docker image. The
# only outside input is the data, read from ../datasets or from $SEVER_DATASETS (README.md).
# Not part of any frozen part (DB-56). Versions follow spec §20.2.

[project]
name = "sever-demo"
version = "0.0.0"
description = "SEVER-DB review demo (Python prototype)"
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.*",
    "scikit-learn==1.9.*",
    "pyarrow==25.0.*",
    "pandas>=3.0.6",
    "rich>=15.0.0",
]

[dependency-groups]
# Build §1.2 (code quality) and §2.1 (test levels L1, L2, L12, L13, L14).
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "import-linter",
    "mutmut",
    "pytest-benchmark",
]

[tool.uv]
package = false
# The repo lives on /mnt/c and uv's cache on ext4, so hardlinks are impossible.
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "mustfail: sabotage test; names the SB item it covers (Build §2.6)",
    "spec(ids): requirement IDs SR-<section>-<n> this test checks (Build §2.2)",
]

[tool.coverage.run]
branch = true
source = ["python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]
# The walkthrough's Python snippets keep their aligned comments; docs are not code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
# ℓ is the spec's own symbol for the ristretto255 group order (§2.1).
allowed-confusables = ["ℓ"]

[tool.ruff.lint.per-file-ignores]
# Entry points: when run as plain files they fix the import path before importing sever_demo.
"python/sever_demo/repl.py" = ["E402"]
"python/sever_demo/demo.py" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "python"

[[tool.mypy.overrides]]
module = ["sklearn.*", "pyarrow.*"]
ignore_missing_imports = true
