# SEVER-DB Python environment (development, WSL). Not an installable package: the packages under
# python/ (C-15 builder, C-18 reference model, test kit; none written yet) are put on the path by
# pytest. The review demo is separate: demo/ has its own pyproject.toml and uv.lock (DB-56).
# Versions follow spec §20.2; exact versions and hashes live in uv.lock. Part 1 packages only —
# later parts add theirs when they start. The P0 encoder environment is separate (CLAUDE.md §8).

[project]
name = "sever-db"
version = "0.0.0"
description = "SEVER-DB: a vector database with provable deletion"
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.*",
    "scikit-learn==1.9.*",
    "pyarrow==25.0.*",
]

[dependency-groups]
# Build §1.2 (code quality) and §2.1 (test levels L1, L2, L12, L13, L14).
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "import-linter",
    "mutmut",
    "pytest-benchmark",
]

[tool.uv]
package = false
# The repo lives on /mnt/c and uv's cache on ext4, so hardlinks are impossible.
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests", "python"]
# Until tests/ exists pytest falls back to the repo root; never collect the demo's own suite or data.
norecursedirs = [".*", "build", "dist", "venv", "demo", "src", "datasets", "docs"]
addopts = "--strict-markers"
markers = [
    "mustfail: sabotage test; names the SB item it covers (Build §2.6)",
    "spec(ids): requirement IDs SR-<section>-<n> this test checks (Build §2.2)",
    "slow: minutes on real data; Extended CI tier only (deselect with -m 'not slow')",
]

[tool.coverage.run]
branch = true
source = ["python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]
# demo/ is its own project with its own ruff settings; src/ holds practice files.
extend-exclude = ["demo", "src", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
# The spec's own symbols: ℓ (group order, §2.1), en dash for ranges, − and × in formulas.
allowed-confusables = ["ℓ", "–", "−", "×"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "python"

[[tool.mypy.overrides]]
module = ["sklearn.*", "pyarrow.*", "scipy.*", "threadpoolctl"]
ignore_missing_imports = true
