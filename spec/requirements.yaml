# Requirement catalogue (Build §2.2; which statements count: spec §0.1, overview DB-58).
# One entry per normative statement. IDs are never reused or renumbered; retired entries stay.
# Schema: Team Handbook WP-5. Catalogue in progress: sections are added module by module.
# Entries below were drafted in write mode on 4 Oct 2026 for the sever-types module (owner review).

- id: SR-0.2-3
  section: "0.2"
  text: "Strings are UTF-8. \"Ascending by bytes\" means lexicographic order of the raw UTF-8 bytes."
  kind: definition
  part: 1
  technique: [table-driven, property]

- id: SR-2.2-1
  section: "2.2"
  text: "Dimension d = 384; fractional bits f = 24 (scale 2^24 = 16,777,216); normalisation tolerance 8 float32 ULPs at 1.0 = 8 · 2^−23; 128 frozen groups; hard cap 1,000,000 members per group; spawn target size 200; capacity multiplier 1.5; probe coverage 25 %, rounded up; record ID length 1 to 256 bytes."
  kind: table-row
  part: 1
  technique: [table-driven]
  notes: "The Part 1 rows of the §2.2 table, asserted against code constants. Parts 2–4 own the other rows. v1 values; the code accepts other d and k (DB-49)."

- id: SR-3.1-1
  section: "3.1"
  text: "A collection is identified by a collection_id: 16 random bytes generated from the OS CSPRNG at creation."
  kind: definition
  part: 1
  technique: [table-driven]
  notes: "Part 1 owns the 16-byte type; generation from the OS CSPRNG is Part 2 (create_collection)."

- id: SR-3.2-1
  section: "3.2"
  text: "A UTF-8 string of 1 to 256 bytes."
  kind: must
  part: 1
  technique: [equivalence, boundary]
  error: InvalidRecordId
  notes: "Classes: 0 bytes, 1, 256, 257 bytes, invalid UTF-8; multi-byte characters count in bytes, not chars."

- id: SR-3.2-2
  section: "3.2"
  text: "It MUST NOT match ^[+-]?[0-9]+$ (a bare decimal integer, with or without sign or leading zeros)."
  kind: must-not
  part: 1
  technique: [equivalence, table-driven]
  error: InvalidRecordId
  notes: "Full match; [0-9] is ASCII only (U+0663 passes). Spec examples: doc0, nq-1234, UUIDs accepted; 1, 007, -3, +3 rejected."

- id: SR-3.2-3
  section: "3.2"
  text: "It MUST NOT equal the ID of a record currently live in the same collection."
  kind: must-not
  part: 1
  technique: [state]
  error: DuplicateRecord
  notes: "Needs index state: owned by sever-index, not sever-types."

- id: SR-3.2-4
  section: "3.2"
  text: "A record ID MAY be inserted again after its record has been deleted."
  kind: must
  part: 1
  technique: [state]
  notes: "sever-index."

- id: SR-5.1-1
  section: "5.1"
  text: "Frozen group ID: frozen-NNNN (4-digit, zero-padded partition label)."
  kind: table-row
  part: 1
  technique: [table-driven, boundary]
  notes: "See G-11: 4 digits cap the label at 9999, while DB-49 and the u16 k_frozen allow more."

- id: SR-5.1-2
  section: "5.1"
  text: "Spawned group ID: spawn- followed by 16 lowercase hex characters (§7.5)."
  kind: table-row
  part: 1
  technique: [table-driven]

- id: SR-5.1-3
  section: "5.1"
  text: "Holding area ID: holding (one per collection)."
  kind: table-row
  part: 1
  technique: [table-driven]

- id: SR-5.1-4
  section: "5.1"
  text: "Group IDs are at most 32 bytes."
  kind: must
  part: 1
  technique: [boundary]

- id: SR-9.7-1
  section: "9.7"
  text: "scrambled_id = HMAC-SHA-512(k_scramble, collection_id ‖ record_id_bytes) — 64 bytes."
  kind: formula
  part: 1
  technique: [table-driven]
  notes: "sever-types owns the 64-byte type; the HMAC (EP-2 HmacSha512Scrambler) is sever-index."

- id: SR-17-1
  section: "17"
  text: "Every error is typed."
  kind: must
  part: 1
  technique: [table-driven]
  notes: "Every row of the §17 table is a variant of sever_types::Error."

- id: SR-17-2
  section: "17"
  text: "No error message may contain a record ID, a vector value, a key, r_t or passage text. Group sizes MAY appear."
  kind: must-not
  part: 1
  technique: [table-driven, property]

# --- §4 vector arithmetic (sever-quant, 4 Oct 2026) ---

- id: SR-4.1-0
  section: "4.1"
  text: "The input MUST have exactly d components. Otherwise reject with WrongDimension."
  kind: must
  part: 1
  technique: [boundary]
  error: WrongDimension
  related: [DB-60]

- id: SR-4.1-1
  section: "4.1"
  text: "Every component MUST be finite."
  kind: must
  part: 1
  technique: [equivalence]
  error: NonFinite
  related: [INV-1]

- id: SR-4.1-2
  section: "4.1"
  text: "Compute norm = sqrt(Σ_{i=0}^{d−1} (f64)x_i²) in float64, summing sequentially from i = 0."
  kind: step
  part: 1
  technique: [table-driven]

- id: SR-4.1-3
  section: "4.1"
  text: "|norm − 1| ≤ 8 · 2^−23 MUST hold. Otherwise reject with NotNormalised."
  kind: must
  part: 1
  technique: [boundary]
  error: NotNormalised
  notes: "Boundaries: exactly ±8 ULPs and one ULP beyond, both sides (below 1.0 that is 16 and 17 steps of 2^−24)."

- id: SR-4.2-1
  section: "4.2"
  text: "x̃_i = round_half_to_even( (f64)x_i · 2^24 ), stored as i32."
  kind: formula
  part: 1
  technique: [table-driven, boundary]
  related: [golden-5]

- id: SR-4.2-2
  section: "4.2"
  text: "Bound: |x̃_i| ≤ 2^24 + 16 = 16,777,232 < 2^31."
  kind: formula
  part: 1
  technique: [boundary]

- id: SR-4.2-3
  section: "4.2"
  text: "The SDK on the application backend and the engine MUST use the same quantiser."
  kind: must
  part: 3
  notes: "Part 3 SDK (sever_db_p3) calls sever-quant through the binding."

- id: SR-4.3-1
  section: "4.3"
  text: "x̂_i = x̃_i / 2^24. For routing it is computed in float64 (exact)."
  kind: formula
  part: 1
  technique: [table-driven]

- id: SR-4.3-2
  section: "4.3"
  text: "For search it is converted to float32 (exact whenever |x̃_i| ≤ 2^24, otherwise rounded to nearest even)."
  kind: formula
  part: 1
  technique: [boundary]

# --- §6 partition, §7.2 distance, overview §10.6 seeds (sever_partition, sever-partition) ---

- {id: SR-6.2-1, section: "6.2", kind: step, part: 1, text: "Quantise and dequantise every reference row (§4.2–4.3), giving X̂_ref in float64. All later steps use X̂_ref."}
- {id: SR-6.2-2, section: "6.2", kind: step, part: 1, text: "k-means on X̂_ref: KMeans(n_clusters=128, init=k-means++, n_init=10, max_iter=300, tol=1e-4, algorithm=lloyd, random_state=seed_kmeans mod 2^32). Group frozen-NNNN is label NNNN."}
- {id: SR-6.2-3, section: "6.2", kind: step, part: 1, text: "Pooled residuals R_j = x̂_j − μ_{c(j)} for every reference row, stacked into one m × d matrix."}
- {id: SR-6.2-4, section: "6.2", kind: step, part: 1, text: "One Ledoit–Wolf shrinkage estimate over all rows of R (assume_centered = False), not an average of per-group fits.", related: [SB-10]}
- {id: SR-6.2-5, section: "6.2", kind: step, part: 1, text: "P = Σ^{-1}, computed by Cholesky factorisation in float64. Stored explicitly and used as stored."}
- {id: SR-6.2-6, section: "6.2", kind: step, part: 1, text: "τ = percentile_99(d_M(x̂_j, μ_{c(j)})) over all reference rows, with §7.2's summation order and linear interpolation."}
- {id: SR-6.2-7, section: "6.2", kind: must, part: 1, text: "The builder computes Ledoit–Wolf from the published formula in plain NumPy and refuses to write the artefact unless shrinkage agrees to 1e-12 and thresholds to 1e-9.", related: [SB-10, P1-T6]}
- {id: SR-6.3-1, section: "6.3", kind: layout, part: 1, text: "partition.svp layout: SVDBPART, u16be version 1, u16be d, u16be k_frozen, u64be seed, f64be tau, f64be lw_shrinkage, u64be m, sha256_reference (32), u16be encoder_len ‖ encoder, centroids f64be row-major, P f64be row-major, sha256_artefact."}
- {id: SR-6.3-2, section: "6.3", kind: must, part: 1, text: "create_collection MUST verify sha256_artefact, d, and that P has finite entries."}
- {id: SR-7.2-1, section: "7.2", kind: formula, part: 1, text: "δ = x̂ − μ_{j*}; y_a = Σ_b P[a][b]·δ_b (sequential in b); q = Σ_a δ_a·y_a (sequential in a); d_M = sqrt(q)."}
- {id: SR-7.2-2, section: "7.2", kind: must, part: 1, text: "q < 0 MUST raise IntegrityViolation."}
- {id: SR-OV-10.6-1, section: "overview 10.6", kind: formula, part: 1, text: "Sub-seeds: u64 from the first 8 bytes of SHA-256(u64be(seed) ‖ label), big-endian; labels kmeans, stream, cohort-order; corpus seed from 42."}

# --- §5 groups, §7 routing, §8 search (sever_refmodel_core; then sever-index, sever-search) ---

- {id: SR-5.2-1, section: "5.2", kind: definition, part: 1, text: "Initial state: S = 0, n = 0 (r_agg = 0, C_S = identity in Part 3)."}
- {id: SR-5.3-1, section: "5.3", kind: formula, part: 1, text: "Insert: S ← S + x̃_t, n ← n + 1. Delete: S ← S − x̃_t, n ← n − 1. All fields change together in one transaction (INV-2).", related: [SB-1, SB-2]}
- {id: SR-5.4-1, section: "5.4", kind: must, part: 1, text: "Physical excision: a deleted record is removed from the member list; no deletion markers."}
- {id: SR-5.4-2, section: "5.4", kind: must, part: 1, text: "Idempotent deletion: if the record is absent, return AlreadyAbsent, change nothing, issue no certificate.", related: [SB-3]}
- {id: SR-5.4-3, section: "5.4", kind: must, part: 1, text: "When n reaches 0, S = 0 exactly; the group stays forever and still occupies a probe slot. Anything dividing by n handles n = 0."}
- {id: SR-5.5-1, section: "5.5", kind: layout, part: 1, text: "Canonical group blob layout (core form SEVERC, DB-47): magic, u16be version 1, u16be d, u64be n, i64be×d S, extension region, u64be member_count, members ascending by ID bytes: u16be id_len ‖ id ‖ i64be×d x̃.", related: [golden-8]}
- {id: SR-5.5-2, section: "5.5", kind: must, part: 1, text: "A parser MUST reject member_count ≠ n, unsorted or duplicate IDs, empty IDs, and trailing bytes (and a magic of the wrong form)."}
- {id: SR-5.5-3, section: "5.5", kind: must, part: 1, text: "assert_state_equivalent compares S, n, C_S, the blob and the member ID list independently; a corruption of any one field MUST be caught.", related: [SB-1]}
- {id: SR-5.5-4, section: "5.5", kind: must, part: 1, text: "Inserting the same set of records in any order MUST yield an identical canonical blob.", related: [P1-T3]}
- {id: SR-5.6-1, section: "5.6", kind: formula, part: 1, text: "A spawned group has room when 2·k·n < 3·N (exact integers)."}
- {id: SR-5.6-2, section: "5.6", kind: must, part: 1, text: "An insert that would make n > 1,000,000 MUST be rejected with GroupCapacityExceeded (INV-4)."}
- {id: SR-7.1-1, section: "7.1", kind: formula, part: 1, text: "j* = argmin_j Σ_i (x̂_i − μ_{j,i})² over frozen groups, f64, sequential; ties to the smaller label."}
- {id: SR-7.3-1, section: "7.3", kind: step, part: 1, text: "Destination: in-distribution (d_M ≤ τ) → frozen j*; OOD → nearest spawned group with room (ties → smaller group-ID bytes) → else holding. k and N are values before this insert."}
- {id: SR-7.3-2, section: "7.3", kind: must, part: 1, text: "Spillover is checked first, on every OOD vector.", related: [SB-8]}
- {id: SR-7.4-1, section: "7.4", kind: must, part: 1, text: "A holding-area record is not added to any accumulator, not counted in N, and not searchable."}
- {id: SR-7.4-2, section: "7.4", kind: must, part: 1, text: "When an insert brings the holding area to exactly 200 records, the same transaction flushes exactly those records into exactly one new spawned group; no clustering."}
- {id: SR-7.4-3, section: "7.4", kind: must, part: 1, text: "A holding-area record is always deletable immediately; deletion is never queued."}
- {id: SR-7.5-1, section: "7.5", kind: formula, part: 1, text: "Spawn ID: 'spawn-' + first 16 lowercase hex of SHA-256(‖_{ids ascending by bytes} u16be(len) ‖ id); an existing ID MUST fail the flush with IntegrityViolation.", related: [golden-7]}
- {id: SR-7.5-2, section: "7.5", kind: formula, part: 1, text: "Centroid μ_i = ((f64)S_i / 2^24) / n at creation, then frozen."}
- {id: SR-7.6-1, section: "7.6", kind: definition, part: 1, text: "N +1 per group insert, +200 per flush, −1 per group deletion; unchanged for holding; k +1 per flush."}
- {id: SR-7.7-1, section: "7.7", kind: must, part: 1, text: "Tests: the same (x̃, state) gives the same destination.", related: [INV-16, SB-7]}
- {id: SR-7.7-2, section: "7.7", kind: must, part: 1, text: "Tests: two states that differ only in group creation order give the same destination.", related: [INV-16, SB-7]}
- {id: SR-7.7-3, section: "7.7", kind: must, part: 1, text: "Tests: the same seed and input order give a byte-identical index."}
- {id: SR-8.1-1, section: "8.1", kind: step, part: 1, text: "Rank frozen and spawned groups by D_g = Σ((f64)q_i − μ_{g,i})², sequential; sort by (D_g, group-ID bytes)."}
- {id: SR-8.1-2, section: "8.1", kind: step, part: 1, text: "Probe p = ⌈0.25·k⌉ groups, empty ones included.", related: [SB-6]}
- {id: SR-8.1-3, section: "8.1", kind: step, part: 1, text: "Score every member of every probed group with the §8.2 kernel on the float32 mirror; return the k smallest by (score, record-ID bytes)."}
- {id: SR-8.1-4, section: "8.1", kind: must-not, part: 1, text: "A deleted record MUST NOT appear in any result produced after its deletion is acknowledged (INV-9).", related: [SB-5, P1-T5]}
- {id: SR-8.2-1, section: "8.2", kind: must, part: 1, text: "Pinned kernel: 8 float32 lanes, lane i mod 8, t = q_i − x̂_i, L_j = L_j + t·t (no FMA), reduction ((L0+L1)+(L2+L3))+((L4+L5)+(L6+L7)); scalar and SIMD bit-identical.", related: [SB-9, P1-T4]}

# --- coverage pass with spec-trace candidates (5 Oct 2026, write mode; owner review) ---
- {id: SR-2.1-1, section: "2.1", kind: definition, part: 1, text: "N (live_vectors) counts records in frozen and spawned groups and k (total_groups) counts frozen plus spawned groups; the holding area is excluded from both."}
- {id: SR-3.5-1, section: "3.5", kind: definition, part: 1, text: "A cohort is the set of records deleted together by delete_user; the caller supplies the list and the engine stores no cohorts."}
- {id: SR-4.4-1, section: "4.4", kind: formula, part: 1, text: "With at most 10^6 members, |S_i| ≤ 10^6 · 16,777,232 < 2^44: 19 bits of headroom in i64. The 10^6 cap is enforced on every insert (INV-4, SR-5.6-2)."}
- {id: SR-4.2-4, section: "4.2", kind: must, part: 2, text: "The SDK on the application backend and the engine MUST use the same quantiser (the commitment is computed from x̃ on the backend).", notes: "Part 2 builds the SDK; Part 1 has one quantiser, sever-quant."}
- {id: SR-6.1-1, section: "6.1", kind: must, part: 1, text: "The engine never fits anything: it imports the partition artefact produced offline by the builder C-15.", technique: [architecture]}
- {id: SR-7-1, section: "7", kind: must, part: 1, text: "Routing is a pure function of (x̃, state): no clock, no arrival counter, no most-recent-group rule; the same (x̃, state) MUST always give the same destination.", related: [SR-7.7-1, INV-16, SB-7]}
- {id: SR-8.2-2, section: "8.2", kind: must, part: 1, text: "d MUST be a multiple of 8 (the kernel's lane layout); an artefact with another d is rejected.", related: [DB-49]}

# --- gaps closed 6 Oct 2026 (DB-61 … DB-64) ---
- {id: SR-5.1-5, section: "5.1", kind: must, part: 1, text: "At most 10,000 frozen groups (labels 0–9999); an artefact with a larger k_frozen is rejected (DB-63)."}
- {id: SR-6.3-3, section: "6.3", kind: must, part: 1, text: "A failed §6.3 check is rejected with IntegrityViolation naming the check, never a value (DB-64)."}

# --- Part 2: sever-vfs (7 Oct 2026, write mode; owner review) ---
- {id: SR-12.2-1, section: "12.2", kind: must, part: 2, text: "Every read and write goes through a Vfs trait: open, read_at, write_at, append, fsync, fsync_dir, rename, unlink, truncate, list, create_dir, remove_dir (DB-65).", technique: [contract]}
- {id: SR-12.2-2, section: "12.2", kind: definition, part: 2, text: "PosixVfs: real files.", technique: [contract]}
- {id: SR-12.2-3, section: "12.2", kind: must, part: 2, text: "SimVfs is in memory and seeded and models the POSIX durability contract conservatively: only fsynced data and fsync_dir'ed directory entries survive a simulated crash.", technique: [contract, property]}
- {id: SR-12.2-4, section: "12.2", kind: must, part: 2, text: "SimVfs can drop any unsynced write, tear a write at any byte, reorder unsynced writes, and make any fsync fail.", technique: [contract]}
- {id: SR-12.2-5, section: "12.2", kind: must, part: 2, text: "All crash tests run on SimVfs, so they are deterministic.", technique: [property], notes: "sever-vfs: the same seed gives the same disk. That every crash test uses SimVfs is checked by the crash kit and the architecture tests."}

# --- Part 2: sever-format (7 Oct 2026, write mode; owner review) ---
- {id: SR-14-1, section: "14", kind: must, part: 2, text: "All structures carry a magic number, a u16be format version and a trailing CRC-32C unless stated; every file in data_dir records its u16be sealer_id right after the format version (DB-48)."}
- {id: SR-14-2, section: "14", kind: must, part: 2, text: "A build MUST refuse a file whose sealer_id differs from its own (IntegrityViolation); every parser rejects a wrong magic, version, sealer_id, CRC, count, order, padding or trailing byte (§14.9)."}
- {id: SR-14.2-1, section: "14.2", kind: definition, part: 2, text: "16,384-byte pages: u32be page_type ‖ u64be page_no ‖ u64be wal_seq ‖ payload ‖ u32be crc32c; written only inside storage checkpoint files."}
- {id: SR-14.3-1, section: "14.3", kind: table-row, part: 2, text: "Group header: group_id zero-padded 32 ‖ kind ‖ seal_version ‖ n ‖ extension public ‖ centroid d × f64 ‖ sealed accumulator (absent for holding); 6,285 bytes released, 6,193 in Part 2 (DB-46)."}
- {id: SR-14.4-1, section: "14.4", kind: table-row, part: 2, text: "Slot: scrambled_id ‖ envelope ‖ sealed payload ‖ padding to 8; payload u16be id_len ‖ id padded to 256 ‖ x̃ as d × i32be ‖ extension record secret; 1,992 bytes released, 1,864 in Part 2 (DB-46)."}
- {id: SR-14.4-2, section: "14.4", kind: must, part: 2, text: "IDs are padded to 256 bytes, which keeps slots fixed-size and hides ID length."}
- {id: SR-14.6-1, section: "14.6", kind: definition, part: 2, text: "WAL record: u32be len (whole record) ‖ u8 type ‖ u64be wal_seq ‖ u64be txn_id ‖ payload ‖ u32be crc32c over every preceding byte (DB-66)."}
- {id: SR-14.6-2, section: "14.6", kind: table-row, part: 2, text: "The record types and payloads of §14.6 (codes 1–17), collection_id first in every change payload; participant payloads carried verbatim (DB-66)."}
- {id: SR-14.8-1, section: "14.8", kind: definition, part: 2, text: "Append-store records: u64be key ‖ u32be len ‖ bytes ‖ u32be crc32c, after the 16-byte file header."}
- {id: SR-14.9-1, section: "14.9", kind: table-row, part: 2, text: "The file layouts of §14.9: store file header, MANIFEST, WAL segment header, SECRETS, collection metadata, paged checkpoint files and their streams (DB-67)."}
- {id: SR-12.3-1, section: "12.3", kind: must, part: 2, text: "Change records carry after-images; replay applies after-images and never decrypts anything."}
- {id: SR-12.3-3, section: "12.3", kind: must, part: 2, text: "On recovery, a transaction without a valid COMMIT (including a torn or CRC-failing tail) is discarded whole. It is never repaired.", related: [SB-11, SB-13]}
- {id: SR-12.7-4, section: "12.7", kind: must, part: 2, text: "Every record on disk has a CRC-32C; every file has a magic number and a format version.", related: [SB-11]}
- {id: SR-15.6-1, section: "15.6", kind: step, part: 2, text: "Serialise the in-memory ciphertext state into checkpoint/<new>.tmp/; fsync every file."}

# --- Part 2: sever-wal and the durability helpers (7 Oct 2026) ---
- {id: SR-12.3-2, section: "12.3", kind: must, part: 2, text: "A transaction is a BEGIN record, change records and a COMMIT record; it is committed exactly when its COMMIT record, with a valid CRC, is durable.", related: [SB-15]}
- {id: SR-12.7-1, section: "12.7", kind: must, part: 2, text: "Every file creation, rename or unlink is followed by fsync of the containing directory.", related: [SB-12]}
- {id: SR-12.7-2, section: "12.7", kind: must, part: 2, text: "An fsync error aborts the process; a failed fsync is never retried.", related: [SB-14]}
- {id: SR-12.4-2, section: "12.4", kind: must, part: 2, text: "An interrupted storage checkpoint leaves the previous one valid."}
- {id: SR-15.6-4, section: "15.6", kind: step, part: 2, text: "Delete older storage checkpoints and covered WAL segments."}
- {id: SR-14.6-3, section: "14.6", kind: must, part: 2, text: "Append-store bytes (certificates, payloads, leaves) are written and fsynced before the COMMIT that references them. Unreferenced bytes after a crash are ignored and overwritten."}
- {id: SR-15.6-2, section: "15.6", kind: step, part: 2, text: "Rename it to checkpoint/<new>/; fsync checkpoint/.", related: [SB-12]}
- {id: SR-15.6-3, section: "15.6", kind: step, part: 2, text: "Write MANIFEST.tmp naming the new storage checkpoint and the first WAL position still needed; fsync; rename to MANIFEST; fsync the directory.", related: [SB-12]}
- {id: SR-12.4-1, section: "12.4", kind: must, part: 2, text: "A storage checkpoint writes the whole in-memory state, in ciphertext form, to a new directory, installs it atomically, and deletes the WAL segments it covers; it runs every 1 GiB of WAL and at clean shutdown."}

# --- Part 2: sever-txn (7 Oct 2026) ---
- {id: SR-15.1-1, section: "15.1", kind: step, part: 2, text: "Insert (Part 2 steps): validate; quantise; route; seal the payload and the passage text; update the group's accumulator; flush in the same transaction if the holding area reaches the target; fsync append-store bytes, then write the WAL transaction, COMMIT, fsync; apply to memory; return the placement."}
- {id: SR-15.2-1, section: "15.2", kind: step, part: 2, text: "Flush inside the triggering insert's transaction: the new group is created, each holding record's payload ciphertext moves unchanged and its record key is re-wrapped for the new group; n = 200, N += 200, k += 1."}
- {id: SR-15.3-1, section: "15.3", kind: step, part: 2, text: "Delete: an absent scrambled_id returns AlreadyAbsent and touches nothing; otherwise one WAL transaction carries the slot move and truncate, locator updates, the new group header and the counters; COMMIT; fsync; apply; acknowledge. delete_user commits one transaction for the whole list."}
- {id: SR-15.8-1, section: "15.8", kind: must, part: 2, text: "An operation returns success only when its transaction is durable and applied to memory (Part 4 adds the key conditions).", related: [SB-15]}

# --- Part 2: sever-engine (7 Oct 2026) ---
- {id: SR-12.5-1, section: "12.5", kind: must, part: 2, text: "One writer at a time (a writer mutex); searches take a shared lock; applying a committed transaction to memory takes the exclusive lock briefly."}
- {id: SR-12.5-2, section: "12.5", kind: must, part: 2, text: "Serializable: a reader that starts before a deletion either finishes before the apply or sees the post-deletion state, never a mix; no retained snapshots."}
- {id: SR-12.9-1, section: "12.9", kind: must, part: 2, text: "Linux x86-64; the data directory is on ext4 or XFS (the allow_unsafe_fs override is recorded in the ledger, owner decision 7 Oct 2026)."}
- {id: SR-12.9-2, section: "12.9", kind: must, part: 2, text: "ENGINE.lock is taken exclusively (one process per data directory)."}
- {id: SR-15.1-2, section: "15.1", kind: must, part: 2, text: "A crash before the COMMIT is durable leaves the database unchanged; after it the insert is done, and a retry fails with DuplicateRecord { same_commitment: true }."}
- {id: SR-15.4-1, section: "15.4", kind: table-row, part: 2, text: "Crash table (Part 2 rows): before COMMIT is durable → unchanged, retrying is safe; after COMMIT → deleted, a retry returns AlreadyAbsent."}
- {id: SR-15.7-1, section: "15.7", kind: step, part: 2, text: "Recovery: read MANIFEST; load the storage checkpoint; replay every WAL transaction with a valid COMMIT; discard the rest; rebuild the in-memory state."}
- {id: SR-15.7-2, section: "15.7", kind: must, part: 2, text: "Full invariant check at every startup (n equals the slot count; S = Σ x̃; every locator entry points at a slot with the same scrambled_id; N and k), and refusal to serve on any violation."}
- {id: SR-15.9-1, section: "15.9", kind: step, part: 2, text: "Drop collection: commit a WAL record removing the collection, then its data leaves the files (Part 4 adds the cryptographic erase)."}
- {id: SR-16.1-1, section: "16.1", kind: definition, part: 2, text: "The engine API: open, create_collection, drop_collection, insert, delete, delete_user (one transaction), search, storage_checkpoint_now, stats; group_snapshot only with test-hooks."}

# --- Part 2: architecture, SDK, E2E (7 Oct 2026) ---
- {id: SR-12.7-3, section: "12.7", kind: must-not, part: 2, text: "No writes go through mmap.", technique: [architecture]}
- {id: SR-12.6-1, section: "12.6", kind: table-row, part: 2, text: "In-memory structures (Part 2 rows): group table, slot arrays exactly as on disk (the storage image), search mirror, locator, counters."}
- {id: SR-14.1-1, section: "14.1", kind: definition, part: 2, text: "Directory layout: ENGINE.lock, MANIFEST, checkpoint/<id>/ (meta.bin, collections.bin, partitions/, groups.bin, slots.bin, locator.bin, payloads.bin), wal/<seq>.wal, payloads/<seq>.store; <key_dir>/SECRETS."}
# Owned by later parts (catalogued now so spec-trace sees every normative line of §12–§15):
- {id: SR-12.3-4, section: "12.3", kind: must-not, part: 4, text: "The WAL MUST NOT contain plaintext vectors, record IDs, passage text, r_t, S, r_agg or unwrapped keys (INV-11); it MAY contain scrambled_ids, n, C_S, centroids and public log leaves.", notes: "DB-48: applies from Part 4; Part 2 stores plaintext."}
- {id: SR-14.4-3, section: "14.4", kind: must, part: 3, text: "has_rt MUST be 1 in every slot; a slot whose payload has has_rt ≠ 1 is an IntegrityViolation."}
- {id: SR-15.1-3, section: "15.1", kind: must, part: 3, text: "Insert step 2: recompute C_t from x̃ and r_t; it MUST equal the supplied C_t; verify the user signature."}
- {id: SR-15.3-2, section: "15.3", kind: must, part: 3, text: "Delete step 2: recompute C_t from the stored x̃ and r_t; it MUST equal the C_t in the record's insert leaf, otherwise IntegrityViolation and touch nothing."}

# Part 3, The Receipt (Build 3-4 §1; scope in PROGRESS "Part 3"). Catalogued on 15 Oct 2026 at Part 3's
# design review, one entry per normative statement (DB-58) of §2.2–2.3 (Part 3 rows), §3.3, §4.5, the
# commitment parts of §5.3–5.5, §9 (not §9.7), §10, §11, §14.4/§14.6/§14.8 (Part 3 rows), the
# certificate and log steps of §15.1–15.3, §16.2, §16.3, §17 (Part 3 rows), INV-3/10/15 and Appendix
# A/B (Part 3 rows and vectors 1, 2, 3, 4, 6, 8, 9). Explanations, soundness notes and "why" text are
# not catalogued (DB-58); P3-T11 covers the soundness argument.
- {id: SR-2.2-2, section: "2.2", kind: table-row, part: 3, text: "Log checkpoint cadence: every 10,000 log leaves, and on demand. Witnesses: 5, threshold 4. Operator and witness key epoch: 90 days."}
- {id: SR-2.3-1, section: "2.3", kind: table-row, part: 3, text: "Domain strings, exact ASCII bytes and lengths: DST_GEN PROJECT_SEVER_V1_RISTRETTO255_SHA512_NUMS (41), DST_POSK SEVERDB_POSK_V1 (15), DST_NONCE SEVERDB_POSK_NONCE_V1 (21), DST_INSERT SEVERDB-INSERT-V1 (17), DST_STH SEVERDB-STH-V1 (14), DST_COSIGN SEVERDB-COSIGN-V1 (17), DST_CERT SEVERDB-CERT-V1 (15)."}
- {id: SR-3.3-1, section: "3.3", kind: must, part: 3, text: "The application backend MUST embed text with the encoder named in the partition artefact's encoder field (§6.3); neither the user app nor the engine embeds anything.", notes: "An obligation on the backend: checked where the project plays the backend (SDK examples, demo, E2E)."}
- {id: SR-3.3-2, section: "3.3", kind: definition, part: 3, text: "A user is identified by an Ed25519 key pair (the user key), generated by the application backend; its public key is published in the log with every insert; user keys never rotate."}
- {id: SR-3.3-3, section: "3.3", kind: definition, part: 3, text: "Deletion is authorised by the application backend; the engine performs no authorisation of its own (delete takes no signature, key or r_t)."}
- {id: SR-4.5-1, section: "4.5", kind: formula, part: 3, text: "scalar(v) = v mod ℓ if v ≥ 0, and ℓ − (|v| mod ℓ) if v < 0, for v ∈ i64.", related: [B-4]}
- {id: SR-5.3-2, section: "5.3", kind: formula, part: 3, text: "Insert: r_agg ← r_agg + r_t mod ℓ, C_S ← C_S + C_t. Delete: r_agg ← r_agg − r_t mod ℓ, C_S ← C_S − C_t. S, n, r_agg and C_S change together in one transaction (INV-2)."}
- {id: SR-5.4-4, section: "5.4", kind: must, part: 3, text: "When n reaches 0, r_agg = 0 and C_S = identity exactly."}
- {id: SR-5.5-5, section: "5.5", kind: layout, part: 3, text: "Full form of the canonical group blob: magic SEVERG, extension region C_S (32) ‖ r_agg (32) between S and member_count; every other field as the core form (DB-47).", related: [B-8]}
- {id: SR-5.5-6, section: "5.5", kind: must, part: 3, text: "The full-form parser applies every rejection rule of SR-5.5-2 and rejects any magic other than SEVERG (the core magic SEVERC included)."}
- {id: SR-5.5-7, section: "5.5", kind: must, part: 3, text: "With commitments, assert_state_equivalent compares all five fields (S, n, C_S, the full-form blob, the member list); a corruption of C_S or r_agg alone MUST be caught.", related: [P3-T5]}
- {id: SR-9.1-1, section: "9.1", kind: table-row, part: 3, text: "Primitives and pinned crates: ristretto255 curve25519-dalek 4.1.3; SHA-512 and SHA-256 sha2 0.10.9; HMAC-SHA-512 hmac 0.12.1; Ed25519 ed25519-dalek 2.2.0; Merlin merlin 3.0.0. No other primitive; none implemented by the project except expand_message_xmd (DB-52)."}
- {id: SR-9.2-1, section: "9.2", kind: formula, part: 3, text: "H = from_uniform_bytes(expand_message_xmd_sha512(b'H', DST_GEN, 64)); G_i = from_uniform_bytes(expand_message_xmd_sha512(b'G' ‖ u32be(i), DST_GEN, 64)) for i = 0 … d−1; one expand_message call per generator.", related: [B-1, INV-10]}
- {id: SR-9.2-2, section: "9.2", kind: must, part: 3, text: "expand_message_xmd with SHA-512 follows RFC 9380 §5.3.1 and matches the RFC 9380 Appendix K.3 vectors; the one-way map is RFC 9496 §4.3.4 and matches the RFC 9496 vectors (DB-52)."}
- {id: SR-9.2-3, section: "9.2", kind: must, part: 3, text: "Startup self-check: re-derive H, G_0 and G_383 and compare them with the golden file at every d, and gdigest when d = 384 (DB-77); run the RFC 9496 one-way-map and RFC 9380 K.3 known-answer tests; refuse to run on any mismatch.", related: [INV-10]}
- {id: SR-9.2-4, section: "9.2", kind: must, part: 3, text: "The verifier (C-16) performs the same generator derivation and self-checks with its own code."}
- {id: SR-9.3-1, section: "9.3", kind: formula, part: 3, text: "C_t = r_t·H + Σ_i scalar(x̃_i)·G_i; C_S = r_agg·H + Σ_i scalar(S_i)·G_i.", related: [INV-3]}
- {id: SR-9.3-2, section: "9.3", kind: formula, part: 3, text: "Public transition check: C_S_post + C_t = C_S_pre."}
- {id: SR-9.3-3, section: "9.3", kind: must, part: 3, text: "On insert the engine MUST recompute C_t from x̃ and the supplied r_t, and reject with CommitmentMismatch if it differs from the supplied C_t."}
- {id: SR-9.4-1, section: "9.4", kind: must, part: 3, text: "The application backend draws r_t as 64 bytes from the OS CSPRNG reduced with from_bytes_mod_order_wide, fresh for every record, and sends it with the insert."}
- {id: SR-9.4-2, section: "9.4", kind: must, part: 3, text: "The engine stores r_t for every record inside the slot payload; adds it into r_agg when the record joins a group (insert or flush) and subtracts the stored r_t at deletion; deletion takes no r_t argument."}
- {id: SR-9.5-1, section: "9.5", kind: layout, part: 3, text: "ctx = C_S_pre (32) ‖ C_t (32) ‖ scrambled_id (64) ‖ u64be(database_lsn) ‖ collection_id (16), 152 bytes."}
- {id: SR-9.5-2, section: "9.5", kind: formula, part: 3, text: "Prover commitment A = k_r·H + Σ_i k_i·G_i, a constant-time multiscalar multiplication."}
- {id: SR-9.5-3, section: "9.5", kind: formula, part: 3, text: "c = from_bytes_mod_order_wide(SHA-512(DST_POSK ‖ C_S_post ‖ A ‖ ctx)), a 231-byte preimage in exactly this order.", related: [B-3]}
- {id: SR-9.5-4, section: "9.5", kind: formula, part: 3, text: "z_r = k_r + c·r_post mod ℓ; z_i = k_i + c·s_i mod ℓ with s_i = scalar(S_post_i)."}
- {id: SR-9.5-5, section: "9.5", kind: layout, part: 3, text: "proof = A ‖ z_r ‖ z_0 ‖ … ‖ z_{d−1}: 32 + 32 + 32·d bytes, 12,352 at d = 384."}
- {id: SR-9.5-6, section: "9.5", kind: step, part: 3, text: "Proof verification: decode A and every z canonically (reject otherwise); recompute c; accept if and only if z_r·H + Σ_i z_i·G_i = A + c·C_S_post."}
- {id: SR-9.6-1, section: "9.6", kind: formula, part: 3, text: "gdigest = SHA-512(H ‖ G_0 ‖ … ‖ G_{d−1}), computed once at startup.", related: [B-2]}
- {id: SR-9.6-2, section: "9.6", kind: step, part: 3, text: "Nonces: Merlin transcript DST_NONCE; append gens = gdigest, stmt = C_S_post, ctx; build_rng; rekey with r = bytes(r_post), then s = bytes(s_i) for i = 0 … d−1 in order; finalize with StrictProofRng (32 bytes of OsRng); k_r, k_0 … k_{d−1} in that order, each from 64 bytes reduced wide."}
- {id: SR-9.6-3, section: "9.6", kind: must, part: 3, text: "StrictProofRng is a zero-sized wrapper around OsRng implementing RngCore + CryptoRng and not SeedableRng; the prove function accepts only this concrete type, so passing a seeded generator does not compile.", related: [SB-18]}
- {id: SR-9.6-4, section: "9.6", kind: must, part: 3, text: "The Python binding (the SDK, §16.2) exposes no way to pass an RNG, seed or nonce into proof generation; any attempt raises SeededNonceForbidden."}
- {id: SR-9.8-1, section: "9.8", kind: layout, part: 3, text: "User insert signature over DST_INSERT ‖ collection_id ‖ C_t, 65 bytes."}
- {id: SR-9.8-2, section: "9.8", kind: layout, part: 3, text: "Operator log-checkpoint signature over DST_STH ‖ u64be tree_size ‖ root ‖ u64be timestamp_ms ‖ u32be epoch, 66 bytes."}
- {id: SR-9.8-3, section: "9.8", kind: layout, part: 3, text: "Witness cosignature over DST_COSIGN ‖ the 66-byte log-checkpoint message, 83 bytes."}
- {id: SR-9.8-4, section: "9.8", kind: layout, part: 3, text: "Operator certificate signature over DST_CERT ‖ certificate body (every byte before the 0xFF trailer, §11.1)."}
- {id: SR-9.8-5, section: "9.8", kind: definition, part: 3, text: "Epoch e covers [genesis + 90·e days, genesis + 90·(e+1) days), genesis = database creation time; operator and witness keys change per epoch; user keys never rotate."}
- {id: SR-9.8-6, section: "9.8", kind: must, part: 3, text: "Old public keys stay resolvable forever, so a certificate signed in an earlier epoch keeps verifying after later epochs begin."}
- {id: SR-9.8-7, section: "9.8", kind: must, part: 3, text: "Every signature check uses verify_strict (rejects small-order keys and non-canonical encodings)."}
- {id: SR-9.8-8, section: "9.8", kind: definition, part: 3, text: "In v1 the five witnesses are simulated by the project and their keys live in the test harness (EP-10 SimulatedWitness, DB-53)."}
- {id: SR-9.9-1, section: "9.9", kind: must, part: 3, text: "All points and scalars MUST be canonical on parse; non-canonical encodings MUST be rejected."}
- {id: SR-9.9-2, section: "9.9", kind: must-not, part: 3, text: "C_t MUST NOT be the identity."}
- {id: SR-10.1-1, section: "10.1", kind: formula, part: 3, text: "One append-only RFC 9162 §2.1 Merkle log per database: SHA-256, leaf_hash = SHA-256(0x00 ‖ leaf), node_hash = SHA-256(0x01 ‖ left ‖ right), the left-heavy tree built from the largest complete left subtree."}
- {id: SR-10.1-2, section: "10.1", kind: must, part: 3, text: "Inclusion and consistency proofs are generated and verified with RFC 9162's own algorithms.", related: [B-9]}
- {id: SR-10.2-1, section: "10.2", kind: layout, part: 3, text: "Insert leaf: 0x01 ‖ collection_id (16) ‖ scrambled_id (64) ‖ C_t (32) ‖ user_public_key (32) ‖ user_signature (64) = 209 bytes, appended on every insert, holding-area inserts included."}
- {id: SR-10.2-2, section: "10.2", kind: layout, part: 3, text: "Delete leaf: 0x02 ‖ certificate bytes, appended on every deletion that removes a record (none for AlreadyAbsent)."}
- {id: SR-10.2-3, section: "10.2", kind: definition, part: 3, text: "database_lsn of an operation is the 0-based index of its leaf; the log is ordered by append position."}
- {id: SR-10.3-1, section: "10.3", kind: definition, part: 3, text: "A log checkpoint is (tree_size, root, timestamp_ms, epoch, operator_signature), signed over the §9.8 message."}
- {id: SR-10.3-2, section: "10.3", kind: must, part: 3, text: "The engine issues a log checkpoint for every multiple of 10,000 that tree_size reaches (both leaf types count), at exactly that size, over committed leaves only, as its own transaction before the next operation (DB-82)."}
- {id: SR-10.3-3, section: "10.3", kind: must, part: 3, text: "The engine issues a log checkpoint on demand before a deletion, at the current size, if a witnessed log checkpoint does not cover every leaf (so the record's insert leaf is covered; DB-80), as its own committed transaction (§15.3 step 3)."}
- {id: SR-10.3-4, section: "10.3", kind: definition, part: 3, text: "The genesis log checkpoint is (tree_size 0, root SHA-256(\"\"), timestamp_ms = database creation time, epoch 0), signed by the operator at creation; every witness starts from it (DB-79)."}
- {id: SR-10.4-1, section: "10.4", kind: must, part: 3, text: "A witness remembers the last log checkpoint it cosigned, obtains the RFC 9162 consistency proof from it to the new one, verifies it, and cosigns only if it verifies.", related: [P3-T12]}
- {id: SR-10.4-2, section: "10.4", kind: definition, part: 3, text: "Five witnesses, threshold four: a log checkpoint with at least four valid cosignatures is witnessed."}
- {id: SR-10.5-1, section: "10.5", kind: must, part: 3, text: "Insert-leaf bytes and all leaf hashes are kept in append-only stores (§14.8)."}
- {id: SR-10.5-2, section: "10.5", kind: must, part: 3, text: "The engine keeps every level of the tree's complete subtrees in memory, so any inclusion proof takes O(log n) hash reads, not a rebuild from the leaves."}
- {id: SR-10.5-3, section: "10.5", kind: layout, part: 3, text: "Each committed leaf's hash entry carries its placement: the group its record joined (insert) or left (deletion), and the spawned group a flush created in that transaction, each as a zero-padded group ID (32 bytes, §13.2); the log export for an auditor holds every leaf, its placement and every checkpoint (DB-86)."}
- {id: SR-11.1-1, section: "11.1", kind: layout, part: 3, text: "Certificate: for tag = 1 … 13 in ascending order, each exactly once, u8 tag ‖ u32be length ‖ value; then u8 0xFF ‖ u32be 64 ‖ operator_signature over DST_CERT ‖ all preceding bytes."}
- {id: SR-11.1-2, section: "11.1", kind: must, part: 3, text: "A certificate parser MUST reject missing, repeated or out-of-order tags, a wrong length for any fixed-size field, and trailing bytes."}
- {id: SR-11.1-3, section: "11.1", kind: table-row, part: 3, text: "Tag values: 1 C_t (32); 2 C_S_pre and 3 C_S_post (32, empty for a holding-area deletion); 4 posk_proof (12,352 at d = 384, empty for holding); 5 the user's insert signature (64); 6 insert_inclusion (§11.2); 7 u8 count ‖ count × (u8 witness_index ‖ u32be witness_epoch ‖ signature 64) over the tag-6 checkpoint; 8 u32be operator epoch; 9 scrambled_id (64); 10 u64be this deletion's own leaf index; 11 group_emptied u8 0 or 1; 12 deletion_kind u8 0 group, 1 holding; 13 collection_id (16)."}
- {id: SR-11.2-1, section: "11.2", kind: layout, part: 3, text: "insert_inclusion: u8 version = 1 ‖ insert_leaf (209) ‖ u64be leaf_index ‖ log checkpoint (u64be tree_size ‖ root 32 ‖ u64be timestamp_ms ‖ u32be epoch ‖ operator_signature 64) ‖ u8 path_len ‖ path_len × 32-byte RFC 9162 inclusion path."}
- {id: SR-11.3-1, section: "11.3", kind: step, part: 3, text: "Verify step 1: parse strictly (§11.1); decode every point and scalar canonically; reject if C_t is the identity."}
- {id: SR-11.3-2, section: "11.3", kind: step, part: 3, text: "Verify step 2: the operator key for tag 8's epoch MUST be in the anchors; verify the trailer signature."}
- {id: SR-11.3-3, section: "11.3", kind: step, part: 3, text: "Verify step 3: leaf type 0x01; the leaf's collection_id, scrambled_id, C_t and user_signature equal tags 13, 9, 1 and 5; verify the user signature over DST_INSERT ‖ collection_id ‖ C_t with the leaf's user key; recompute the leaf hash and verify the inclusion path against the checkpoint root; verify the checkpoint's operator signature for its epoch."}
- {id: SR-11.3-4, section: "11.3", kind: step, part: 3, text: "Verify step 4: at least four cosignatures from distinct witnesses, each valid for its epoch, over that log checkpoint."}
- {id: SR-11.3-5, section: "11.3", kind: step, part: 3, text: "Verify step 5: database_lsn (tag 10) > leaf_index (tag 6)."}
- {id: SR-11.3-6, section: "11.3", kind: step, part: 3, text: "Verify step 6, deletion_kind = 0: C_S_post + C_t = C_S_pre; the proof verifies with ctx = C_S_pre ‖ C_t ‖ scrambled_id ‖ u64be(database_lsn) ‖ collection_id; group_emptied = 1 if and only if C_S_post is the identity."}
- {id: SR-11.3-7, section: "11.3", kind: step, part: 3, text: "Verify step 7, deletion_kind = 1: tags 2, 3 and 4 are empty and tag 11 is 0; only steps 1–5 apply."}
- {id: SR-11.3-8, section: "11.3", kind: step, part: 3, text: "Verify step 8: accept only if every step passes.", related: [P3-T1, P3-T2]}
- {id: SR-11.3-9, section: "11.3", kind: definition, part: 3, text: "Verifier inputs: the certificate and the trust anchors bundled with the release (operator public keys by epoch, witness public keys by epoch, the generator golden file); no database access (DB-79)."}
- {id: SR-11.3-10, section: "11.3", kind: definition, part: 3, text: "The auditor (sever-audit, C-17), with log access, checks what a certificate cannot: the deletion leaf was appended at database_lsn; consecutive certificates of a group chain (C_S_pre = the previous C_S_post); the log is consistent across log checkpoints.", related: [P3-T6]}
- {id: SR-14.4-4, section: "14.4", kind: layout, part: 3, text: "Commitment extension record secret: u64be insert_leaf_index ‖ u8 has_rt ‖ r_t (32) = 41 bytes; payload plaintext 1,835 bytes (DB-46)."}
- {id: SR-14.6-4, section: "14.6", kind: table-row, part: 3, text: "Log WAL records: LOG_LEAF (u64be leaf_index ‖ the leaf hash ‖ the leaf's placement (64, DB-86); for insert leaves also the 209-byte leaf; DB-81), LOG_CHECKPOINT (the checkpoint with its cosignatures), CERT_REF (database_lsn ‖ store segment ‖ offset ‖ length ‖ SHA-256 of the certificate)."}
- {id: SR-14.8-2, section: "14.8", kind: must, part: 3, text: "Certificates and insert leaves are stored as public append-store records (key database_lsn or leaf index), written and fsynced before the COMMIT that references them."}
- {id: SR-15.1-4, section: "15.1", kind: step, part: 3, text: "Insert step 6: build the insert leaf in the insert's transaction; the cadence log checkpoint follows as its own transaction (§10.3, DB-82)."}
- {id: SR-15.1-5, section: "15.1", kind: step, part: 3, text: "Insert step 9: return (database_lsn, placement)."}
- {id: SR-15.1-6, section: "15.1", kind: must, part: 3, text: "The Part 3 SDK treats DuplicateRecord { same_commitment: true } on a retried insert as success."}
- {id: SR-15.2-2, section: "15.2", kind: step, part: 3, text: "Flush: each record's r_t is added into the new group's r_agg (has_rt stays 1) and C_S = r_agg·H + Σ scalar(S_i)·G_i."}
- {id: SR-15.3-3, section: "15.3", kind: step, part: 3, text: "Delete step 3: if a witnessed log checkpoint does not cover every leaf, create one first, as its own committed transaction (DB-80)."}
- {id: SR-15.3-4, section: "15.3", kind: step, part: 3, text: "Delete step 4: compute the post-state; for a group deletion compute ctx and the proof; build the certificate with database_lsn = the next leaf index, and sign it."}
- {id: SR-15.3-5, section: "15.3", kind: must, part: 3, text: "Delete step 6: the delete leaf and the certificate reference commit in the same WAL transaction as the state change: no certificate for a rolled-back deletion, no orphaned leaf (DB-24).", related: [P3-T4]}
- {id: SR-15.3-6, section: "15.3", kind: step, part: 3, text: "Delete step 9: acknowledge with the certificate."}
- {id: SR-16.2-1, section: "16.2", kind: definition, part: 3, text: "SDK on the application backend: UserKey.generate() (Ed25519); prepare_insert(collection_id, record_id, vector, user) quantises, draws r_t, computes C_t and signs, with r_t inside the request; engine.insert(collection_id, req); engine.delete(collection_id, record_id) with no r_t argument."}
- {id: SR-16.3-1, section: "16.3", kind: table-row, part: 3, text: "sever-verify <certificate> --anchors FILE verifies a certificate with bundled anchors (§11.3) and reports acceptance or the failed step (DB-85)."}
- {id: SR-16.3-2, section: "16.3", kind: table-row, part: 3, text: "sever-audit <log export> --anchors FILE checks deletion leaves, certificate chains and log consistency, and reports what it finds (DB-86)."}
- {id: SR-17-3, section: "17", kind: table-row, part: 3, text: "CommitmentMismatch when the supplied C_t differs from the recomputed C_t at insert."}
- {id: SR-17-4, section: "17", kind: table-row, part: 3, text: "BadUserSignature when the insert signature fails."}
- {id: SR-17-5, section: "17", kind: table-row, part: 3, text: "SeededNonceForbidden on any attempt to supply randomness to proof generation."}
- {id: SR-21-3, section: "21", kind: table-row, part: 3, text: "INV-3: C_S = r_agg·H + Σ scalar(S_i)·G_i for every group; checked at startup and in debug builds."}
- {id: SR-21-10, section: "21", kind: table-row, part: 3, text: "INV-10: the generators equal the golden file; checked at startup."}
- {id: SR-21-15, section: "21", kind: table-row, part: 3, text: "INV-15: the log root at every log-checkpoint size equals that checkpoint's root (checked at startup), and every live record's insert leaf exists (checked at each deletion, §15.3 step 2; DB-83)."}
- {id: SR-A-1, section: "A", kind: table-row, part: 3, text: "Sizes at d = 384: proof challenge preimage 231 bytes; proof 12,352 bytes; hedged nonce output 385 × 64 = 24,640 bytes; user insert-signature message 65 bytes; insert leaf 209 bytes; witness threshold 4."}
- {id: SR-A-2, section: "A", kind: table-row, part: 3, text: "A group-deletion certificate with a 21-hash inclusion path is ≈ 14,093 bytes (13 TLV fields and the signature).", related: [P3-T13]}
- {id: SR-B-1, section: "B", kind: must, part: 3, text: "Golden vector 1: the encodings of H, G_0 and G_383, checked by the engine and the verifier with independent code."}
- {id: SR-B-2, section: "B", kind: must, part: 3, text: "Golden vector 2: gdigest = SHA-512(H ‖ G_0 ‖ … ‖ G_383), checked by the engine and the verifier."}
- {id: SR-B-3, section: "B", kind: must, part: 3, text: "Golden vector 3: a fixed (C_S_post, A, ctx) and its challenge c, checked by the engine and the verifier; a must-fail test shows that swapping A and C_S_post changes c."}
- {id: SR-B-4, section: "B", kind: must, part: 3, text: "Golden vector 4: scalar(v) for v ∈ {0, 1, −1, 2^44, −2^44}, checked by the engine and the verifier."}
- {id: SR-B-6, section: "B", kind: must, part: 3, text: "Golden vector 6: a complete honest group-deletion certificate and a holding-area certificate with all intermediate values, checked by the engine and the verifier."}
- {id: SR-B-8, section: "B", kind: must, part: 3, text: "Golden vector 8 (full form): the canonical SEVERG blob of a fixed three-member group."}
- {id: SR-B-9, section: "B", kind: must, part: 3, text: "Golden vector 9: RFC 9162 inclusion and consistency proofs for a fixed 7-leaf tree, checked by the engine and the verifier."}
