  - {id: KF-2, text: "The active slot of a domain is removed (E2E-4.7)", expect: refuse, requirements: [SR-13.4-3, SR-21-14]}
  - {id: KF-3, text: "The inactive slot of a domain holds another version (an orphan of phase A)", expect: start, requirements: [SR-13.4-3, SR-15.4-3]}
  - {id: KF-4, text: "The inactive slot of a domain is torn", expect: start, requirements: [SR-13.4-3, SR-14.7-3]}
  - {id: KF-5, text: "A slot pair belongs to no domain (a rolled-back create or flush)", expect: start, requirements: [SR-13.4-3], gap: G-27}
  - {id: KF-6, text: "A crash during recovery's erasure; the next start erases again", expect: start, requirements: [SR-13.4-3, SR-21-13]}

