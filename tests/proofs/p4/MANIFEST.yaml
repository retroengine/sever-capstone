# Proofs for Part 4 (CLAUDE.md §6.3). Each entry: a patch that breaks one rule and the tests that
# must go red (red), stay green (green: the label was removed), or stay green while keeping the
# label (limit: what the test does not notice). Check: python -m sever_testkit_p4.proofs check
- id: PR4-K01
  claim: the key file header carries format version 2 instead of 1 (§14.7, §14.9)
  kind: red
  requirements:
  - SR-14.7-1
  patch: PR4-K01.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_header_is_the_exact_bytes_of_section_14_7
- id: PR4-K02
  claim: 'opening an existing key file rewrites its header (§14.7: written once, never rewritten)'
  kind: red
  requirements:
  - SR-14.7-1
  patch: PR4-K02.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_the_header_is_written_once_and_checked_at_open
- id: PR4-K03
  claim: 'the slot stores group_id before collection_id (§14.7 order: collection_id ‖ group_id)'
  kind: red
  requirements:
  - SR-14.7-2
  patch: PR4-K03.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_slot_is_the_exact_bytes_of_section_14_7
- id: PR4-K04
  claim: 'an erased slot is overwritten with 0xFF instead of zeros (§14.7: 512 zero bytes)'
  kind: red
  requirements:
  - SR-14.7-2
  patch: PR4-K04.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_an_erased_slot_is_512_zero_bytes
- id: PR4-K05
  claim: a slot's CRC is not checked, so a torn slot is read as valid (§14.7)
  kind: red
  requirements:
  - SR-14.7-3
  patch: PR4-K05.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_a_torn_slot_is_treated_as_absent
- id: PR4-K06
  claim: 'a new domain appends one 512-byte slot instead of a 1,024-byte pair (§14.7: 1 KB per domain)'
  kind: red
  requirements:
  - SR-14.7-5
  patch: PR4-K06.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_the_file_is_4096_bytes_plus_1024_per_domain
- id: PR4-K07
  claim: 'a new domain''s index is not the next pair position (§14.7: pair i at 4,096 + 1,024·i, in creation order)'
  kind: red
  requirements:
  - SR-14.7-4
  patch: PR4-K07.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_a_domain_index_is_its_pair_position_in_creation_order
- id: PR4-K08
  claim: 'a trailing partial pair is left in place at open (§14.7: truncated at recovery)'
  kind: red
  requirements:
  - SR-14.7-6
  patch: PR4-K08.patch
  runner: cargo
  package: sever-keys
  tests:
  - crates/sever-keys/src/tests.rs::p4_keys_a_trailing_partial_pair_is_truncated_at_open
- id: PR4-K09
  claim: writing a slot (phase A) returns before the fsync (§13.4)
  kind: red
  requirements:
  - SR-13.4-2
  patch: PR4-K09.patch
  runner: cargo
  package: sever-keys
  tests:
