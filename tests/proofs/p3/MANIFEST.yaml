# Proofs for Part 3 (CLAUDE.md §6.3). Each entry: a patch that breaks one rule and the tests that
# must go red (red), stay green (green: the label was removed), or stay green while keeping the
# label (limit: what the test does not notice). A cargo proof in a separate workspace names it:
# `workspace: verifier` or `workspace: audit`. Run: python -m sever_testkit_p3.proofs run
- id: PR3-C01
  claim: a domain string of §2.3 differs by one character
  kind: red
  requirements:
  - SR-2.3-1
  patch: PR3-C01.patch
  runner: cargo
  package: sever-crypto
  tests:
  - crates/sever-crypto/src/tests.rs::p3_crypto_domain_strings_are_the_exact_bytes_of_section_2_3
- id: PR3-C02
  claim: expand_message_xmd pads msg with 64 zero bytes instead of s_in_bytes = 128 (RFC 9380 §5.3.1)
  kind: red
  requirements:
  - SR-9.2-2
  patch: PR3-C02.patch
  runner: cargo
  package: sever-crypto
  tests:
  - crates/sever-crypto/src/tests.rs::p3_crypto_expand_message_xmd_matches_rfc9380_k3
- id: PR3-C03
  claim: the one-way map reads each 32-byte half big-endian instead of little-endian (RFC 9496 §4.3.4)
  kind: red
  requirements:
  - SR-9.2-2
  patch: PR3-C03.patch
  runner: cargo
  package: sever-crypto
  tests:
  - crates/sever-crypto/src/tests.rs::p3_crypto_one_way_map_matches_rfc9496_a3
- id: PR3-C04
  claim: point decoding returns the identity instead of rejecting a non-canonical encoding
  kind: red
  requirements:
  - SR-9.9-1
  patch: PR3-C04.patch
  runner: cargo
  package: sever-crypto
  tests:
  - crates/sever-crypto/src/tests.rs::p3_crypto_decode_point_accepts_canonical_and_rejects_rfc9496_invalid_encodings
- id: PR3-C05
  claim: scalar decoding reduces values >= ℓ instead of rejecting them
  kind: red
  requirements:
  - SR-9.9-1
  patch: PR3-C05.patch
  runner: cargo
  package: sever-crypto
  tests:
  - crates/sever-crypto/src/tests.rs::p3_crypto_decode_scalar_rejects_values_at_or_above_the_group_order
- id: PR3-C06
  claim: scalar(v) for v < 0 is off by one (ℓ − |v| − 1)
  kind: red
  requirements:
  - SR-4.5-1
  patch: PR3-C06.patch
  runner: cargo
  package: sever-crypto
  tests:
  - crates/sever-crypto/src/tests.rs::p3_crypto_scalar_map_follows_section_4_5
